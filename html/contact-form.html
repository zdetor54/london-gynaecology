<form class="contact-form" action="https://formsubmit.co/ajax/mrfarshadtahmasebi@theclinic.co.uk" method="POST">
    <div class="section-title pb-4 text-center">
        <h1>Get in Touch</h1>
    </div>
    
    <!-- Success Message -->
    <div id="form-success-message" class="alert alert-success text-center" style="display: none;">
        <i class="fas fa-check-circle me-2"></i>
        <strong>Thank you!</strong> Your message has been sent successfully. We will get back to you soon.
    </div>
    
    <!-- Error Message -->
    <div id="form-error-message" class="alert alert-danger text-center" style="display: none;">
        <i class="fas fa-exclamation-circle me-2"></i>
        <strong>Oops!</strong> Something went wrong. Please try again or contact us directly.
    </div>
    
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="New Appointment Request">
    
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Name*</label>
            <input type="text" name="name" class="form-control" placeholder="Type Your Name Here" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Email*</label>
            <input type="email" name="email" class="form-control" placeholder="Type Your Email Here" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Phone</label>
            <input type="tel" name="phone" class="form-control" placeholder="Type Your Phone Here">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea name="message" class="form-control" rows="5" placeholder="Type Your Message Here"></textarea>
    </div>
    <div class="text-white justify-content-center d-flex align-items-center">
        <button type="submit" class="btn text-white">
            Send Message <i class="fas fa-caret-right"></i>
        </button>
    </div>
    
</form>
